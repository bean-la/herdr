name: brndr build and publish

# Build and publish only. Herm owns installation, project-user sync, restart
# markers, and restart policy in its own IaC. This workflow never SSHes to Herm-b,
# installs a binary, or restarts a server. Deploydaddy/operator may invoke
# Herm's scripts/remote/brndr-install.sh for a selected immutable artifact SHA.

on:
  push:
    branches: [brndr]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/macos-split-linker.sh'
  # Workflow-only edits do not auto-trigger release builds; use workflow_dispatch.
  workflow_dispatch:

# Last push wins — installs are fast and idempotent, so cancelling an older
# queued run is correct.
concurrency:
  group: brndr-deploy
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-publish-linux:
    name: Build + publish Linux artifact
    # Linux builds run on GitHub-hosted runners; deployment is handled by Herm IaC.
    runs-on: ubuntu-latest

    env:
      RUST_TOOLCHAIN_VERSION: 1.96.1
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseSafe
      LIBGHOSTTY_VT_SIMD: 'false'
      HERM_HOST: ${{ secrets.HERM_HOST }}
      HERM_SSH_KEY: ${{ secrets.HERM_SSH_KEY }}
      HERM_SSH_KNOWN_HOSTS: ${{ secrets.HERM_SSH_KNOWN_HOSTS }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Cache Rust and Zig build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .zig-cache
            vendor/libghostty-vt/.zig-cache
            vendor/libghostty-vt/zig-out
          key: brndr-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN_VERSION }}-${{ hashFiles('Cargo.lock', 'vendor/libghostty-vt/build.zig*') }}

      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Verify toolchain
        run: cargo --version && zig version

      - name: Build Linux artifact
        shell: bash -eo pipefail {0}
        run: |
          HERDR_BUILD_ID="${GITHUB_SHA:0:8}" cargo build --release --locked
          cp target/release/brndr herdr-linux-x86_64
          chmod 0755 herdr-linux-x86_64
          { echo "version=0.9.0"; echo "protocol=22"; echo "commit=$GITHUB_SHA"; sha256sum herdr-linux-x86_64; } > BUILD_INFO-linux.txt

      - name: Publish immutable Linux artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="brndr-${GITHUB_SHA}"
          if gh release view "$tag" --repo bean-la/herdr >/dev/null 2>&1; then
            echo "Release $tag already exists; skipping immutable release creation"
          else
            gh release create "$tag" --repo bean-la/herdr --target "$GITHUB_SHA" \
              --title "$tag" --notes "Immutable brndr build for ${GITHUB_SHA}." \
              herdr-linux-x86_64 BUILD_INFO-linux.txt
          fi

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: herdr-linux-x86_64
          path: |
            herdr-linux-x86_64
            BUILD_INFO-linux.txt
          retention-days: 14

  # macOS build for the laptop, from the SAME settled commit as the herm-b
  # linux build — so brndr --remote's version-match check passes against
  # herm-b and the laptop brndr-bin stays in lockstep. Fleet laptops are
  # Apple Silicon; GitHub macos-latest is ARM and cannot cross-compile
  # x86_64-apple-darwin with the current zig/ghostty toolchain.
  # Publish the aarch64 macOS build to the rolling `brndr-latest` release
  # (--latest=false keeps semantic releases as GitHub's "latest").
  build-macos:
    name: Build macOS (brndr-latest release)
    needs: build-publish-linux
    runs-on: macos-latest
    env:
      RUST_TOOLCHAIN_VERSION: 1.96.1
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseSafe
      LIBGHOSTTY_VT_SIMD: 'false'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-apple-darwin

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Cache Rust and Zig build artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .zig-cache
            vendor/libghostty-vt/.zig-cache
            vendor/libghostty-vt/zig-out
          key: brndr-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN_VERSION }}-aarch64-apple-darwin-${{ hashFiles('Cargo.lock', 'vendor/libghostty-vt/build.zig*') }}

      - name: Install macOS build tools
        run: brew install cmake ninja

      - name: Build
        # zig 0.15.2's archive has a misaligned compiler_rt.o that Apple ld64
        # rejects — split linker routes exe links to zig (lld, tolerant) and
        # proc-macro dylib links to Apple cc (see scripts/macos-split-linker.sh).
        env:
          CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER: ${{ github.workspace }}/scripts/macos-split-linker.sh
          CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER: ${{ github.workspace }}/scripts/macos-split-linker.sh
        run: HERDR_BUILD_ID="${GITHUB_SHA:0:8}" cargo build --release --locked --target aarch64-apple-darwin

      - name: Package artifact
        run: |
          # Cargo bin is named brndr (the herdr fork's binary); ship it under
          # the herdr-macos-aarch64 asset name for consistent install URLs.
          cp target/aarch64-apple-darwin/release/brndr herdr-macos-aarch64
          file herdr-macos-aarch64 > BUILD_INFO.txt
          {
            echo "version=0.9.0"
            echo "protocol=22"
            echo "commit=$GITHUB_SHA"
            echo "target=aarch64-apple-darwin"
            echo "libghostty_vt_optimize=$LIBGHOSTTY_VT_OPTIMIZE"
            echo "libghostty_vt_simd=$LIBGHOSTTY_VT_SIMD"
          } >> BUILD_INFO.txt
          python3 -c "import hashlib, pathlib; artifact = pathlib.Path('herdr-macos-aarch64'); print(f'sha256={hashlib.sha256(artifact.read_bytes()).hexdigest()}  {artifact.name}')" >> BUILD_INFO.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: herdr-macos-aarch64
          path: |
            herdr-macos-aarch64
            BUILD_INFO.txt
          retention-days: 14

  publish-rolling:
    name: Publish brndr-latest release
    needs: [build-publish-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish rolling brndr-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO=bean-la/herdr
          linux_dir="artifacts/herdr-linux-x86_64"
          macos_arm_dir="artifacts/herdr-macos-aarch64"
          test -f "$linux_dir/herdr-linux-x86_64"
          test -f "$linux_dir/BUILD_INFO-linux.txt"
          test -f "$macos_arm_dir/herdr-macos-aarch64"
          test -f "$macos_arm_dir/BUILD_INFO.txt"
          gh release view brndr-latest --repo "$REPO" >/dev/null 2>&1 \
            || gh release create brndr-latest --repo "$REPO" --latest=false \
                 --title "brndr rolling builds" --notes "Rolling herdr fork builds for the settled commit."
          gh release upload brndr-latest --repo "$REPO" --clobber \
            "$linux_dir/herdr-linux-x86_64" "$linux_dir/BUILD_INFO-linux.txt" \
            "$macos_arm_dir/herdr-macos-aarch64" "$macos_arm_dir/BUILD_INFO.txt"
