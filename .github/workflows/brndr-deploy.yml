name: brndr build and publish

# Herm-owned deploy for the herdr fork's stable branch (2026-08-14, operator
# decision "A"): builds brndr, installs brndr/herdr to ~/.local/bin
# on herm-b, and NOTIFIES when a server restart is required. NEVER auto-restarts
# — restarting the server kills live remote panes, so that stays a manual
# operator step (see scripts/remote/brndr-install.sh).
#
# The actual build runs ON herm-b (brndr-install.sh, which needs the rust/zig
# toolchain there). This job therefore runs on the registered herm-b
# self-hosted runner and invokes the install locally; GitHub-hosted runners
# cannot resolve or reach herm-b over its private tailnet.
#
# Mirrors bean-la/herm's dashboard-deploy.yml mechanics: ssh to HERM_HOST as
# herm (HERM_SSH_KEY secrets), all git/build in clean /tmp worktrees, logic in
# a scripts/remote/*.sh file (avoids nested bash/YAML/SSH quoting).

on:
  push:
    branches: [brndr]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/remote/brndr-install.sh'
      - 'scripts/macos-split-linker.sh'
      - '.github/workflows/brndr-deploy.yml'
  workflow_dispatch:

# Last push wins — installs are fast and idempotent, so cancelling an older
# queued run is correct.
concurrency:
  group: brndr-deploy
  cancel-in-progress: true

jobs:
  build-publish-linux:
    name: Build + publish Linux artifact
    # Must run on herm-b: the host is private tailnet-only and the build
    # requires the toolchain installed there.
    runs-on: self-hosted

    env:
      HERM_HOST: ${{ secrets.HERM_HOST }}
      HERM_SSH_KEY: ${{ secrets.HERM_SSH_KEY }}
      HERM_SSH_KNOWN_HOSTS: ${{ secrets.HERM_SSH_KNOWN_HOSTS }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Rust and Zig toolchain paths
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          if [ -d "$HOME/.local/zig-0.15.2" ]; then
            echo "$HOME/.local/zig-0.15.2" >> "$GITHUB_PATH"
          elif [ -d "$HOME/.local/zig" ]; then
            echo "$HOME/.local/zig" >> "$GITHUB_PATH"
          else
            echo 'No Herm Zig toolchain found' >&2
            exit 1
          fi
          cargo --version
          zig version

      - name: Build Linux artifact
        shell: bash -eo pipefail {0}
        run: |
          HERDR_BUILD_ID="${GITHUB_SHA:0:8}" cargo build --release --locked
          cp target/release/brndr herdr-linux-x86_64
          chmod 0755 herdr-linux-x86_64
          sha256sum herdr-linux-x86_64 > BUILD_INFO-linux.txt

      - name: Publish immutable Linux artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="brndr-${GITHUB_SHA}"
          gh release create "$tag" --repo bean-la/herdr --target "$GITHUB_SHA" \
            --title "$tag" --notes "Immutable brndr build for ${GITHUB_SHA}." \
            herdr-linux-x86_64 BUILD_INFO-linux.txt
          gh release upload brndr-latest --repo bean-la/herdr --clobber \
            herdr-linux-x86_64 BUILD_INFO-linux.txt || true

  # macOS build for the laptop, from the SAME settled commit as the herm-b
  # linux build — so brndr --remote's version-match check passes against
  # herm-b and the laptop brndr-bin stays in lockstep. Fleet laptops are
  # Apple Silicon only, so just aarch64 (no x86_64 mac build). Published to
  # a rolling `brndr-latest` release (--latest=false keeps semantic releases
  # as GitHub's "latest"); the laptop fetches herdr-macos-aarch64 from there.
  # Steps mirror build-artifacts-manual.yml's build-macos job (same pinned
  # toolchain), with the patched brew zig (see Install step).
  build-macos:
    name: Build macOS (brndr-latest release)
    runs-on: macos-latest
    env:
      RUST_TOOLCHAIN_VERSION: 1.96.1
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseSafe
      LIBGHOSTTY_VT_SIMD: 'false'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-apple-darwin

      - name: Install Zig (patched brew formula)
        # The official ziglang.org 0.15.2 tarball's lld rejects the vendored
        # libghostty-vt archive (misaligned compiler_rt.o); the homebrew
        # zig@0.15 formula carries the mach-o archive fix (same choice as
        # release.yml). Keg-only — add its bin to PATH explicitly.
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install zig@0.15
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix zig@0.15)/bin/zig" version

      - name: Install macOS build tools
        run: brew install cmake ninja

      - name: Remove Zig caches
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        # zig 0.15.2's archive has a misaligned compiler_rt.o that Apple ld64
        # rejects — split linker routes exe links to zig (lld, tolerant) and
        # proc-macro dylib links to Apple cc (see scripts/macos-split-linker.sh).
        env:
          CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER: ${{ github.workspace }}/scripts/macos-split-linker.sh
        run: HERDR_BUILD_ID="${GITHUB_SHA:0:8}" cargo build --release --locked --target aarch64-apple-darwin

      - name: Package artifact
        run: |
          # Cargo bin is named brndr (the herdr fork's binary); ship it under
          # the herdr-macos-aarch64 asset name for consistent install URLs.
          cp target/aarch64-apple-darwin/release/brndr herdr-macos-aarch64
          file herdr-macos-aarch64 > BUILD_INFO.txt
          {
            echo "commit=$GITHUB_SHA"
            echo "target=aarch64-apple-darwin"
            echo "libghostty_vt_optimize=$LIBGHOSTTY_VT_OPTIMIZE"
            echo "libghostty_vt_simd=$LIBGHOSTTY_VT_SIMD"
          } >> BUILD_INFO.txt
          python3 -c "import hashlib, pathlib; artifact = pathlib.Path('herdr-macos-aarch64'); print(f'sha256={hashlib.sha256(artifact.read_bytes()).hexdigest()}  {artifact.name}')" >> BUILD_INFO.txt

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: herdr-macos-aarch64
          path: |
            herdr-macos-aarch64
            BUILD_INFO.txt
          retention-days: 14

      - name: Publish to brndr-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO=bean-la/herdr
          gh release view brndr-latest --repo "$REPO" >/dev/null 2>&1 \
            || gh release create brndr-latest --repo "$REPO" --latest=false \
                 --title "brndr rolling builds" \
                 --notes "Rolling herdr fork builds for the settled commit — herm-b installs the linux build, laptops fetch the macos build."
          gh release upload brndr-latest --repo "$REPO" --clobber herdr-macos-aarch64 BUILD_INFO.txt
