name: brndr deploy (herm-b)

# Herm-owned deploy for the herdr fork's stable branch (2026-08-14, operator
# decision "A"): builds brndr, installs brndr/herdr to ~/.local/bin
# on herm-b, and NOTIFIES when a server restart is required. NEVER auto-restarts
# — restarting the server kills live remote panes, so that stays a manual
# operator step (see scripts/remote/brndr-install.sh).
#
# The actual build runs ON herm-b (brndr-install.sh, which needs the rust/zig
# toolchain there), so this runs on a GitHub-hosted runner that merely
# orchestrates: checkout + SSH to herm-b + invoke the install. (2026-08-16:
# was self-hosted, but no runner is registered for bean-la/herdr so the job
# stayed queued forever — switched to ubuntu-latest.)
#
# Mirrors bean-la/herm's dashboard-deploy.yml mechanics: ssh to HERM_HOST as
# herm (HERM_SSH_KEY secrets), all git/build in clean /tmp worktrees, logic in
# a scripts/remote/*.sh file (avoids nested bash/YAML/SSH quoting).

on:
  push:
    branches: [brndr]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/remote/brndr-install.sh'
      - 'scripts/macos-split-linker.sh'
      - '.github/workflows/brndr-deploy.yml'
  workflow_dispatch:

# Last push wins — installs are fast and idempotent, so cancelling an older
# queued run is correct.
concurrency:
  group: brndr-deploy
  cancel-in-progress: true

jobs:
  build-install:
    name: Build + install + notify on herm-b
    # The build itself runs ON herm-b via ssh (brndr-install.sh) — the runner
    # only orchestrates, so a hosted runner is fine. self-hosted had no runner
    # registered and jobs queued forever (2026-08-16; also fixed on main).
    runs-on: ubuntu-latest

    env:
      HERM_HOST: ${{ secrets.HERM_HOST }}
      HERM_SSH_KEY: ${{ secrets.HERM_SSH_KEY }}
      HERM_SSH_KNOWN_HOSTS: ${{ secrets.HERM_SSH_KNOWN_HOSTS }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          echo "${HERM_SSH_KEY}" > ~/.ssh/id_ed25519
          echo "${HERM_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts

      - name: Build + install + stale-detect + notify
        shell: bash -eo pipefail {0}
        run: |
          OUT="$(ssh "${HERM_HOST}" "sudo -u herm -H bash -lc 'cd /home/herm/repos/github.com/bean-la/herdr && git fetch bean-la brndr && git show FETCH_HEAD:scripts/remote/brndr-install.sh > /tmp/brndr-install.sh && bash /tmp/brndr-install.sh ${GITHUB_SHA}'")"
          echo "$OUT"
          if grep -q 'restart_required=1' <<< "$OUT"; then
            echo "::warning::brndr installed, but a running server still maps the replaced binary. Operator must restart the brn session server to load the new build."
          fi

      - name: Verify install
        shell: bash -eo pipefail {0}
        run: |
          ssh "${HERM_HOST}" "sudo -u herm -H bash -lc 'ls -l ~/.local/bin/brndr ~/.local/bin/herdr && ~/.local/bin/brndr --version && cat /var/lib/brn/brndr-restart-required 2>/dev/null || true'"

  # macOS builds for the laptop, from the SAME settled commit as the herm-b
  # linux build — so brndr --remote's version-match check passes against
  # herm-b and the laptop brndr-bin stays in lockstep. Published to a rolling
  # `brndr-latest` release (--latest=false keeps semantic releases as GitHub's
  # "latest"); the laptop fetches herdr-macos-x86_64 from there. Steps mirror
  # build-artifacts-manual.yml's build-macos job (same pinned toolchain).
  build-macos:
    name: Build macOS (brndr-latest release)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            name: herdr-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: herdr-macos-aarch64
    permissions:
      contents: write
    env:
      RUST_TOOLCHAIN_VERSION: 1.96.1
      LIBGHOSTTY_VT_OPTIMIZE: ReleaseSafe
      LIBGHOSTTY_VT_SIMD: 'false'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Install macOS build tools
        run: brew install cmake ninja

      - name: Remove Zig caches
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        # zig 0.15.2's archive has a misaligned compiler_rt.o that Apple ld64
        # rejects — split linker routes exe links to zig (lld, tolerant) and
        # proc-macro dylib links to Apple cc (see scripts/macos-split-linker.sh).
        env:
          CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER: ${{ github.workspace }}/scripts/macos-split-linker.sh
          CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER: ${{ github.workspace }}/scripts/macos-split-linker.sh
        run: HERDR_BUILD_ID="${GITHUB_SHA:0:8}" cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact
        run: |
          cp target/${{ matrix.target }}/release/herdr ${{ matrix.name }}
          file ${{ matrix.name }} > BUILD_INFO.txt
          {
            echo "commit=$GITHUB_SHA"
            echo "target=${{ matrix.target }}"
            echo "libghostty_vt_optimize=$LIBGHOSTTY_VT_OPTIMIZE"
            echo "libghostty_vt_simd=$LIBGHOSTTY_VT_SIMD"
          } >> BUILD_INFO.txt
          python3 -c "import hashlib, pathlib; artifact = pathlib.Path('${{ matrix.name }}'); print(f'sha256={hashlib.sha256(artifact.read_bytes()).hexdigest()}  {artifact.name}')" >> BUILD_INFO.txt

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}
            BUILD_INFO.txt
          retention-days: 14

      - name: Publish to brndr-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO=bean-la/herdr
          gh release view brndr-latest --repo "$REPO" >/dev/null 2>&1 \
            || gh release create brndr-latest --repo "$REPO" --latest=false \
                 --title "brndr rolling builds" \
                 --notes "Rolling herdr fork builds for the settled commit — herm-b installs the linux build, laptops fetch the macos build."
          gh release upload brndr-latest --repo "$REPO" --clobber "${{ matrix.name }}" BUILD_INFO.txt
